# 复制为 corrections.yaml 后按实际 OCR block_id 修改。
# 补丁只在 M2 内存副本中应用，永不覆盖 data/ocr 下的原始结果。
corrections:
  - correction_id: fix-example-text
    action: replace_text
    document_id: doc_example
    page_number: 10
    block_id: block_example
    old_text: "11. 6. 1. 3"
    new_text: "11.6.1.3"
    reason: "人工核对原始 PDF 后修正条款号"

  - correction_id: drop-example-watermark
    action: drop_block
    document_id: doc_example
    page_number: 10
    block_id: watermark_block_example
    reason: "确认该块为非规范正文水印"

  - correction_id: exclude-example-page
    action: exclude_page
    document_id: doc_example
    page_number: 2
    reason: "确认该页为扫描插页，不属于规范正文"

