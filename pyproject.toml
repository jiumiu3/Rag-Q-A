[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oil-gas-compliance-agent"
version = "0.1.0"
description = "油气管网仪表与自动控制规范审查 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # 锁定兼容 httpx TestClient 的 0.115 系列，避免 Starlette 1.x 客户端迁移造成阻塞。
  "fastapi>=0.115,<0.116",
  "Pillow>=11,<13",
  "PyMuPDF>=1.25,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
ocr = [
  "onnxruntime>=1.20,<2.0",
  "rapidocr>=3,<4",
]

index = [
  "faiss-cpu>=1.9,<2.0",
]

agent = [
  "langgraph>=0.6,<2.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
]

dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["data/"]

[[tool.mypy.overrides]]
module = ["fitz", "rapidocr", "numpy", "numpy.*", "yaml", "langgraph", "langgraph.*"]
ignore_missing_imports = true
follow_imports = "skip"
